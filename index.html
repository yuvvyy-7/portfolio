<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio
    </title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <style>
        @keyframes gradient-shift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
    </style>

</head>

<body class="min-h-screen w-full bg-linear-to-tr from-black via-zinc-950 to-zinc-600 text-slate-100 bg-size-[200%_200%] animate-[gradient-shift_7s_ease_infinite] bg-fixed transition-[background-position] pb-100">
    <nav class="h-15 border-b flex gap-7 align-center font-['Pacifico',cursive]">
        <div class="basis-3/5 flex gap-4">
             <div class="w-10 h-10 cursor-pointer">
                <img src="./images/lawl sprite.png" class="js-lawl-sprite rounded-full m-1 ml-3 ease-in-out hover:scale-120 hover:rotate-400 duration-700">
             </div>
             <div class="js-lawl-sprite-text m-1 ml-10 text-2xl self-center opacity-0 -translate-x-7 transition-transform duration-750">

             </div>
        </div>
       
        <div class="basis-2/5 flex gap-15 justify-end mr-10 self-center text-xl">
            <div class="hover:text-black text-shadow-black text-shadow-xs"> 
                <a href="#skill">Skills</a> 
            </div>
            
            <div class="hover:text-black text-shadow-black text-shadow-xs">
                <a href="#project">Project</a>
            </div>
            
            <div class="hover:text-black text-shadow-black text-shadow-xs">
                <a href="#contact">Contact</a>
            </div>
        </div>
       

    </nav>
    
    <div class="flex flex-col justify-center items-center">
        <main class="w-screen h-125 p-5 flex relative">
            
            <div class="w-300 h-80 ml-30 mt-20 flex justify-center rounded-full align-center">
                <img src="./images/itachiyuv.gif" class="rounded-full m-1 ring-2 ring-amber-100 drop-shadow-xl drop-shadow-amber-50 hover:-translate-y-0.5 hover:drop-shadow-red-500 hover:drop-shadow-2xl ease-in-out transition duration-400">
            </div>

            <div class="w-900 h-80 mt-20 ml-20 flex justify-center font-['Pacifico',cursive] flex-col space-y-4">
                <h1 class="text-6xl text-white font-['Playfair_Display',serif]">    I am Yuvraj    </h1> 
                <h2 class="text-3xl text-red-100">    An aspiring Software Dev </h2>
                
            </div>

            <div class="absolute top-10 right-[7%] text-zinc-300 text-xl animate-[twinkle_3s_ease-in-out_infinite]">
                ✦
            </div>

            <div class="absolute top-20 right-[40%] text-zinc-300 text-xl animate-[twinkle_3s_ease-in-out_infinite]">
                ✦
            </div>

            <div class="absolute top-32 right-[25%] text-zinc-200 text-sm animate-[twinkle_4s_ease-in-out_infinite]">
                ✧
            </div>

            <div class="absolute top-40 right-[10%] text-zinc-200 text-sm animate-[twinkle_4s_ease-in-out_infinite]">
                ✧
            </div>

            <div class="absolute top-52 right-[40%] text-white text-xs animate-[twinkle_2s_ease-in-out_infinite]">
                ✦
            </div>

            <div class="absolute top-60 right-[19%] text-white text-s animate-[twinkle_2s_ease-in-out_infinite]">
                ✦
            </div>

            <div class="absolute top-90 right-[8%] text-white text-xl animate-[twinkle_2s_ease-in-out_infinite]">
                ✦
            </div>

            <div class="absolute bottom-32 right-[30%] text-zinc-300 text-lg animate-[twinkle_3s_ease-in-out_infinite]">
                ✧
            </div>
            
        </main> 

        <div id="skill" class="flex flex-col gap-5 w-300 h-90 bg-zinc-900 rounded-xl text-white border-2 border-cyan-100 p-3 shadow-md shadow-cyan-100 hover:shadow-cyan-200 hover:border-cyan-200">
            <section class="font-['Pacifico',cursive] font-bold underline underline-offset-3 text-2xl">
                My Skills
            </section>
            <section class="flex flex-col gap-6  text-xl font-['Pacifico',cursive]">
                <div class="flex gap-3">
                    <img src="./images/arrow.png" class="h-20 w-19">
                    <div class="relative group inline-flex items-center">

                        <!-- Main Button -->
                         <button class="h-12 w-30 bg-yellow-200 rounded-md border-black border-2 shadow-md shadow-black text-black mt-2">Frontend</button>


                        <!-- Expanding Thread -->
                        <div
                            class="absolute left-full top-1/2 -translate-y-1/2
                                flex items-center
                                opacity-0 invisible
                                group-hover:opacity-100 group-hover:visible
                                transition-all duration-500
                                -translate-x-1
                                group-hover:translate-x-0">

                            <!-- Thread -->
                            <div class="w-12 h-0.5 bg-white"></div>

                            <!-- Skills -->
                            <div class="flex gap-3">

                            <button class="px-4 py-2 mt-2 rounded-lg bg-white text-black border-2 border-black
                                            hover:scale-110 transition">
                                HTML
                            </button>

                            <button class="px-4 py-2 mt-2 rounded-lg bg-cyan-700 text-white
                                            hover:scale-110 transition">
                                CSS
                            </button>

                            <button class="px-4 py-2 mt-2 rounded-lg bg-cyan-700 text-white
                                            hover:scale-110 transition">
                                JavaScript
                            </button>

                            <button class="px-4 py-2 mt-2 rounded-lg bg-cyan-700 text-white
                                            hover:scale-110 transition">
                                React
                            </button>

                            </div>

                        </div>

                        </div>
                </div>
               
               <div class="flex gap-3">
                    <img src="./images/arrow.png" class="h-20 w-19">
                    <button class="h-12 w-30 rounded-md bg-orange-400 text-black border-black border-2 shadow-md shadow-black mt-2">Backend</button>
                </div>

                <div class="flex gap-3">
                    <img src="./images/arrow.png" class="h-20 w-19">
                    <button class="h-12 w-30 rounded-md bg-green-400 text-black border-black border-2 shadow-md shadow-black mt-2">BasS</button>
                </div>

            </section>
        </div>
        
        <div class="flex flex-col gap-5 w-300 h-70 bg-zinc-900 rounded-xl text-white mt-20 p-3 border-2 border-red-100 shadow-md shadow-red-100 hover:shadow-red-200 hover:border-red-200">
            <section class="font-['Pacifico',cursive] font-bold underline underline-offset-3 text-2xl">
                My Skills
            </section>
            <section class="flex flex-col gap-6  text-xl ml-4">
               <button class="h-12 w-30 rounded-md border-zinc-400 border-2 shadow-md shadow-cyan-200">Frontend</button>
               <button class="h-12 w-30 rounded-md border-zinc-400 border-2 shadow-md shadow-cyan-200">Backend</button>
               <button class="h-12 w-30 rounded-md border-zinc-400 border-2 shadow-md shadow-cyan-200">BasS</button>

            </section>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
